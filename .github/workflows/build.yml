name: C2J Windows Build

on:
  push:
    branches: [ main, master, dev ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOURCE_DIR: c2j
  TARGET: x86_64-pc-windows-gnu

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# Job 1: 빌드 + 테스트 + Windows .exe 생성 (전부 Linux Runner에서)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Windows x86_64 .exe 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      # ── 소스 압축 해제 ─────────────────────────────────────────────────
      - name: c2j_v4.tar.gz 압축 해제
        run: |
          tar xzf c2j_v4.tar.gz
          echo "압축 해제 완료"
          ls -la ${{ env.SOURCE_DIR }}/

      # ── MinGW 크로스컴파일러 설치 ─────────────────────────────────────
      - name: MinGW 설치 (Windows 크로스컴파일용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version

      # ── Rust + Windows 타겟 설치 ───────────────────────────────────────
      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # ── Cargo 캐시 ─────────────────────────────────────────────────────
      - name: Cargo 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SOURCE_DIR }}/target/
          key: mingw-${{ env.TARGET }}-${{ hashFiles('c2j/Cargo.lock') }}
          restore-keys: |
            mingw-${{ env.TARGET }}-

      # ── MinGW 링커 환경변수 설정 ───────────────────────────────────────
      - name: MinGW 링커 설정
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc"                  >> $GITHUB_ENV
          echo "AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar"                   >> $GITHUB_ENV

      # ── libc 크레이트 Windows 호환 설정 ───────────────────────────────
      # libc는 unix-only이므로 Windows 빌드 시 제외
      - name: Cargo.toml Windows 호환 패치
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # libc의 unix-only 조건부 의존성 확인 (이미 cfg(unix)로 선언됨)
          grep -n "libc" Cargo.toml || true

      # ── 테스트 (Linux 타겟으로 — 빠른 피드백) ─────────────────────────
      - name: 단위 테스트 (Linux)
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo test --verbose

      # ── Windows .exe 빌드 ──────────────────────────────────────────────
      - name: Windows x86_64 릴리스 빌드
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cargo build --release --target ${{ env.TARGET }}
          ls -lh target/${{ env.TARGET }}/release/c2j.exe

      # ── 빌드 결과 확인 ─────────────────────────────────────────────────
      - name: .exe 파일 정보 확인
        run: |
          file ${{ env.SOURCE_DIR }}/target/${{ env.TARGET }}/release/c2j.exe
          ls -lh ${{ env.SOURCE_DIR }}/target/${{ env.TARGET }}/release/c2j.exe
          echo "빌드 성공 ✓"

      # ── 아티팩트 업로드 ────────────────────────────────────────────────
      - name: c2j.exe 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: c2j-windows-x86_64
          path: ${{ env.SOURCE_DIR }}/target/${{ env.TARGET }}/release/c2j.exe
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: GitHub Release (태그 push 시에만)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release 생성
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: c2j.exe 다운로드
        uses: actions/download-artifact@v4
        with:
          name: c2j-windows-x86_64
          path: release/

      - name: 버전 추출
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "빌드 버전: ${VERSION}"

      - name: 릴리스 노트 작성
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cat > /tmp/release_notes.md << EOF
          ## C2J ${VERSION} — Windows x86_64

          JVM \`.class\` / \`.jar\` 파일을 \`.java\` 소스로 변환하는 디컴파일러

          ### 다운로드

          | 파일 | 설명 |
          |---|---|
          | \`c2j.exe\` | Windows 64-bit 실행 파일 |

          ### 사용법

          \`\`\`cmd
          :: 단일 클래스 디컴파일
          c2j.exe Example.class

          :: 출력 경로 지정
          c2j.exe Example.class -o Example.java

          :: JAR 전체 디컴파일
          c2j.exe MyApp.jar -o src\

          :: 컴파일 검증 (javac 필요)
          c2j.exe Example.class --verify

          :: 도움말
          c2j.exe --help
          \`\`\`
          EOF

      - name: GitHub Release 생성 + .exe 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "C2J ${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/c2j.exe
            c2j_v4.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
